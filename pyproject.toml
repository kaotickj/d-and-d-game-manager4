[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "d-and-d-game-manager4"
version = "0.6.3"
description = "Offline D&D 3.5 character and monster game manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyQt6>=6.6,<7"]
authors = [{name = "Kaotick Jay"}]

[project.scripts]
dndgm4 = "dndgm4.__main__:main"

[tool.setuptools.packages.find]
include = ["dndgm4*"]

[tool.setuptools.package-data]
dndgm4 = ["assets/*.jpg", "assets/*.png", "assets/*.ico"]
