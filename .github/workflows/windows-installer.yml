name: Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install package and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller

      - name: Run domain and Qt tests
        timeout-minutes: 5
        run: python -c "import faulthandler, unittest; faulthandler.dump_traceback_later(180, exit=True); unittest.main(module=None, argv=['unittest', 'discover', '-s', 'tests', '-v'])"

      - name: Bundle desktop application
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name DnDGameManager4 --icon dndgm4/assets/app_icon.ico --collect-submodules dndgm4 --collect-data dndgm4 --add-data "dndgm4/assets;dndgm4/assets" build/windows_launcher.py
          if (!(Test-Path "dist/DnDGameManager4/DnDGameManager4.exe")) { throw "Missing bundled executable" }
          # Prevent release of the broken installation reported by users:
          # dragon_crest.png missing under _internal/dndgm4/assets.
          foreach ($art in @("dragon_crest.png", "app_banner.jpg", "name_genie_crest.png", "checkmark.svg", "chevron_down.svg", "chevron_up.svg")) {
            $required = Join-Path "dist/DnDGameManager4/_internal/dndgm4/assets" $art
            if (!(Test-Path $required)) { throw "Missing packaged artwork: $required" }
          }
        shell: pwsh

      - name: Install Inno Setup 6
        run: choco install innosetup --yes --no-progress
        shell: pwsh

      - name: Build upgrade-safe installer
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler unavailable: $iscc" }
          & $iscc "/DAppVersion=$version" "installer/DnDGameManager4.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (!(Test-Path "dist/DnDGameManager4-Setup.exe")) { throw "Missing installer" }

      - name: Exercise bundled app, silent installation and reinstall
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build/windows_acceptance.ps1

      - name: Package portable ZIP
        shell: pwsh
        run: Compress-Archive -Path "dist/DnDGameManager4" -DestinationPath "dist/DnDGameManager4-Portable.zip"

      - name: Upload test builds
        uses: actions/upload-artifact@v4
        with:
          name: DnDGameManager4-Windows-${{ github.run_number }}
          path: |
            dist/DnDGameManager4-Setup.exe
            dist/DnDGameManager4-Portable.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DnDGameManager4-Windows-Acceptance-${{ github.run_number }}
          path: dist/windows-acceptance/
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" "dist/DnDGameManager4-Setup.exe" "dist/DnDGameManager4-Portable.zip" --title "D&D Game Manager ${{ github.ref_name }}" --generate-notes
